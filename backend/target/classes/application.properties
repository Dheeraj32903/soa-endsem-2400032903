spring.application.name=GreenRootsBackend
server.port=2005

# PostgreSQL Database Configuration (Local Database)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/endsem-2400032903
spring.datasource.username=postgres
spring.datasource.password=admin123

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Eureka Client for standalone local run (prevents connection exceptions)
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
