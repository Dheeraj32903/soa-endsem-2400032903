services:
  # PostgreSQL Database Container
  postgres-db:
    image: postgres:16-alpine
    container_name: treeplanation-postgres
    restart: always
    environment:
      POSTGRES_DB: treeplantationevnet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - greenroots-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenroots_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Backend REST API Service
  backend:
    image: dheeraj200579/docker-backend-2400032903:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: treeplantation-backend
    restart: on-failure
    ports:
      - "8081:2005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/treeplantationevent-2400032903
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - treeplantation-net

networks:
  treeplantation-net:
    driver: bridge

volumes:
  postgres_data:
